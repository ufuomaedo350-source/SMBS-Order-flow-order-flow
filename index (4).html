<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SMBS Order Flow</title>
<style>
  :root{--bg:#05070a;--pn:#0d1117;--bd:#1c222c;--tx:#d1d4dc;--mt:#787b86}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px -apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  input,select,textarea{-webkit-user-select:text;user-select:text}
  #top{position:fixed;top:0;left:0;right:0;height:40px;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:4px;padding:0 6px;z-index:5;overflow-x:auto;white-space:nowrap}
  .logo{color:#e8b84a;font:700 15px Georgia,serif;letter-spacing:1px;padding:0 6px 0 2px;flex:none}
  #sym{width:96px;background:transparent;border:1px solid var(--bd);border-radius:4px;color:#fff;font:700 13px sans-serif;padding:5px 7px;text-transform:uppercase;flex:none}
  .tfb,.tb{background:transparent;border:0;color:var(--tx);font:13px sans-serif;padding:6px 8px;border-radius:4px;cursor:pointer;flex:none}
  .tfb:hover,.tb:hover{background:var(--pn)}
  .tfb.on{color:#2962ff;background:#10203d}
  #ct{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:5px 4px;font:12px sans-serif;flex:none}
  .sep{width:1px;height:20px;background:var(--bd);margin:0 4px;flex:none}
  #st{color:var(--mt);font-size:11px;margin-left:8px;flex:none}
  #lt{position:fixed;top:40px;left:0;bottom:0;width:40px;background:var(--bg);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;z-index:5}
  #lt button{width:32px;height:32px;background:transparent;border:0;border-radius:4px;color:var(--tx);font-size:16px;cursor:pointer}
  #lt button.on{background:var(--pn);color:#2962ff}
  canvas{position:absolute;top:40px;left:40px;touch-action:none;display:block}
  .menu{position:fixed;top:44px;right:8px;z-index:6;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:10px 12px;display:none;max-height:calc(100% - 56px);overflow:auto;min-width:250px}
  .menu.show{display:block}
  .menu h4{margin:10px 0 4px;color:var(--mt);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
  .menu h4:first-child{margin-top:0}
  .menu .r{display:flex;align-items:center;gap:6px;padding:3px 0;white-space:nowrap}
  .menu .r label{flex:1;display:flex;align-items:center;gap:6px}
  .menu input,.menu select,.menu button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:3px 6px;font:12px sans-serif}
  .menu input[type=checkbox]{padding:0}
  .menu input[type=number]{width:58px}
  .menu button.gr{padding:1px 7px;font-size:14px;cursor:pointer}
  .menu small{display:block;color:var(--mt);font-size:11px;line-height:1.35;margin-top:4px;white-space:normal;max-width:240px}
  #dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:center;justify-content:center}
  #dlg.show{display:flex}
  #dlg .box{width:min(94vw,540px);max-height:92vh;background:#0f1218;border:1px solid #232834;border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
  #dlg .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:14px;letter-spacing:.5px;color:#fff}
  #dlg .x{background:transparent;border:0;color:var(--tx);font-size:24px;cursor:pointer;line-height:1}
  #dlg .tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid #232834;overflow-x:auto}
  #dlg .tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mt);padding:10px;white-space:nowrap;font:13px sans-serif;cursor:pointer}
  #dlg .tabs button.on{color:#fff;border-bottom-color:#fff}
  #dlg .body{padding:10px 16px;overflow:auto;flex:1}
  #dlg .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0}
  #dlg .row input[type=number],#dlg .row select{background:#0a0d12;color:#fff;border:1px solid #232834;border-radius:5px;padding:6px 8px;width:160px;font:13px sans-serif}
  #dlg .row input[type=color]{width:46px;height:28px;border:1px solid #232834;background:transparent;padding:0}
  #dlg .row input[type=checkbox]{width:18px;height:18px;accent-color:#20b98a}
  #dlg .note{color:var(--mt);font-size:12px;line-height:1.45;padding:6px 0}
  #dlg .ft{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #232834}
  #dlg .ft span{flex:1}
  #dlg .ft button{background:#0a0d12;color:#fff;border:1px solid #232834;border-radius:6px;padding:8px 14px;font:13px sans-serif;cursor:pointer}
  #tape{position:fixed;top:40px;right:0;bottom:0;width:250px;background:var(--bg);border-left:1px solid var(--bd);font:11px ui-monospace,Menlo,Consolas,monospace;overflow:hidden;display:none;z-index:4}
  #tape .th,#tape .tr{display:grid;grid-template-columns:62px 1fr 50px 38px;gap:4px;padding:2px 8px;white-space:nowrap}
  #tape .th{color:var(--mt);border-bottom:1px solid var(--bd);padding:6px 8px}
  #tape .tr.b{color:#26a69a} #tape .tr.s{color:#ef5350} #tape .tr.big{background:rgba(255,255,255,.07);font-weight:700}
  #tape .tr span:nth-child(1){color:#8b94a3} #tape .tr span:nth-child(2),#tape .tr span:nth-child(3){text-align:right}
  #pad{position:fixed;right:80px;bottom:76px;z-index:7;display:none;grid-template-columns:repeat(4,40px);gap:4px;opacity:.88}
  #pad.show{display:grid}
  #pad button{height:40px;border-radius:8px;border:1px solid var(--bd);background:rgba(30,34,45,.94);color:var(--tx);font-size:17px;touch-action:none}
</style>
</head>
<body>
<div id="top">
  <span class="logo">SMBS</span>
  <input id="sym" value="XAUUSDT" spellcheck="false" autocomplete="off" autocapitalize="characters">
  <div class="sep"></div>
  <span id="tfs"></span>
  <div class="sep"></div>
  <select id="ct"><option>Candles</option><option>Hollow candles</option><option>Bars</option><option>Heikin Ashi</option><option>Line</option><option>Area</option></select>
  <button class="tb" id="cg" title="Candle settings">&#9881; Candles</button>
  <button class="tb" id="bi">Indicators</button>
  <button class="tb" id="bs">Settings</button>
  <span id="st">connecting...</span>
</div>
<div id="lt">
  <button id="t_x" class="on" title="Crosshair">&#10011;</button>
  <button id="t_h" title="Horizontal line">&#8213;</button>
  <button id="t_t" title="Trend line">/</button>
  <button id="t_c" title="Remove drawings">&#10005;</button>
</div>
<div id="mi" class="menu">
  <h4>Footprint</h4>
  <div class="r"><label><input type="checkbox" id="fp" checked>Footprint (bid x ask)</label><button class="gr" data-d="fpd">&#9881;</button></div>
  <div class="r"><label><input type="checkbox" id="zn" checked>Footprint zones</label></div>
  <h4>Order flow</h4>
  <div class="r"><label><input type="checkbox" id="sg" checked>Absorption / Exhaustion</label><button class="gr" data-d="ae">&#9881;</button></div>
  <div class="r"><label><input type="checkbox" id="bb" checked>Orderflow bubbles</label><button class="gr" data-d="bub">&#9881;</button></div>
  <div class="r"><label><input type="checkbox" id="lo" checked>Limit orders</label><button class="gr" data-d="lim">&#9881;</button></div>
  <div class="r"><label><input type="checkbox" id="bk" checked>Book ladder</label></div>
  <h4>Profiles</h4>
  <div class="r"><label><input type="checkbox" id="vp" checked>Volume profile</label></div>
  <div class="r"><label><input type="checkbox" id="dp" checked>Delta profile</label></div>
  <div class="r"><label><input type="checkbox" id="nd" checked>HVN / LVN</label></div>
  <h4>Overlays</h4>
  <div class="r"><label><input type="checkbox" id="vw" checked>VWAP</label></div>
  <div class="r"><label><input type="checkbox" id="vb">VWAP bands</label></div>
  <div class="r"><label><input type="checkbox" id="m1" checked>MA 1</label><input type="number" id="l1" value="200" min="2" max="1000"></div>
  <div class="r"><label><input type="checkbox" id="m2" checked>MA 2</label><input type="number" id="l2" value="233" min="2" max="1000"></div>
  <div class="r"><label>MA type</label><select id="mt"><option>EMA</option><option>SMA</option></select></div>
  <h4>Extras (off by default)</h4>
  <div class="r"><label><input type="checkbox" id="dv">Delta divergence</label></div>
  <div class="r"><label><input type="checkbox" id="tr">Trapped buyers / sellers</label></div>
</div>
<div id="ms" class="menu">
  <h4>Chart</h4>
  <div class="r"><label>Row size</label><select id="tick"><option value="0">Auto</option><option>0.1</option><option>0.5</option><option>1</option><option>5</option><option>10</option></select></div>
  <div class="r"><label><input type="checkbox" id="pd">Touch controls (arrows, zoom)</label></div>
  <div class="r"><label><input type="checkbox" id="lg" checked>Indicator list (top-left)</label></div>
  <div class="r"><button id="rv">Reset view</button></div>
  <h4>Data sources</h4>
  <div class="r"><label><input type="checkbox" id="xbn" checked>Binance Futures</label></div>
  <div class="r"><label><input type="checkbox" id="xby">Bybit</label></div>
  <div class="r"><label><input type="checkbox" id="xok">OKX</label></div>
  <div class="r"><label><input type="checkbox" id="xhl">Hyperliquid</label></div>
  <small>Bybit, OKX and Hyperliquid add live trades only. They have no history, so keep Binance only for accurate footprint history.</small>
  <h4>Recorder (optional)</h4>
  <div class="r"><input id="rec" placeholder="https://your-server" size="20"></div>
  <div class="r"><button id="ra">Apply and reload</button></div>
</div>
<div id="pad">
  <button data-n="L">&#9664;</button><button data-n="U">&#9650;</button><button data-n="D">&#9660;</button><button data-n="R">&#9654;</button>
  <button data-n="ZI">+</button><button data-n="ZO">&minus;</button><button data-n="RS">&#10226;</button><button data-n="NOW">&#9197;</button>
</div>
<div id="tape"></div>
<div id="dlg"></div>
<canvas id="c"></canvas>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const UP = '#26a69a', DN = '#ef5350', BGC = '#05070a', GRID = '#10141b', TXT = '#d1d4dc', MUT = '#787b86';
addEventListener('error', e => { try { $('st').textContent = 'JS error: ' + e.message; } catch(x){} });

// ===== fixed tuning (the detailed, user-facing settings live in the settings dialogs) =====
const CFG = {
  absK: 1.5, heavyK: 3, exhFrac: 0.25, exhRows: 6,   // Classic engine
  divFrac: 0.05, maxZones: 6, hvnK: 1.3, lvnK: 0.5, maxNodes: 3, trapK: 1.3, trapLook: 3,
  bfPages: 40, lazyPages: 40,
  ticks: [.01,.02,.05,.1,.2,.5,1,2,5,10,20,50,100,200,500]
};

// ===================== SETTINGS (schema driven, like DeltaMerge / TradingView) =====================
const F = {
  num: (k, l, d, mn, mx, st) => ({k, l, t: 'n', d, mn, mx, st: st || 1}),
  bool: (k, l, d) => ({k, l, t: 'b', d: !!d}),
  sel: (k, l, o, d) => ({k, l, t: 's', o, d: d || o[0]}),
  col: (k, l, d) => ({k, l, t: 'c', d}),
  note: l => ({t: 'i', l})
};
const SCH = {
  cnd: {title: 'CANDLES', tabs: {
    Style: [
      F.sel('chartType', 'Chart type', ['Candles', 'Hollow candles', 'Bars', 'Heikin Ashi', 'Line', 'Area']),
      F.bool('bodyOn', 'Body', 1), F.bool('borderOn', 'Borders', 1), F.bool('wickOn', 'Wick', 1),
      F.col('upCol', 'Up body', UP), F.col('dnCol', 'Down body', DN),
      F.col('upBor', 'Up border', UP), F.col('dnBor', 'Down border', DN),
      F.col('upWick', 'Up wick', UP), F.col('dnWick', 'Down wick', DN),
      F.num('bodyW', 'Body width %', 70, 20, 100, 5)],
    'Line / Area': [
      F.num('lineW', 'Line width', 2, 1, 6, 1), F.col('lineCol', 'Line colour', '#2962ff'), F.num('areaOp', 'Area opacity %', 25, 0, 80, 5)]
  }},
  fpd: {title: 'FOOTPRINT', tabs: {
    Cells: [
      F.bool('fpText', 'Show numbers', 1), F.sel('cellMode', 'Cell colour', ['Volume intensity', 'Delta']),
      F.num('fpOp', 'Cell opacity %', 100, 20, 100, 5), F.bool('fpPOC', 'Highlight POC row', 1),
      F.bool('fpTot', 'Totals under columns', 1), F.bool('fpVA', 'Value area lines (VAH / VAL)', 1)],
    Imbalance: [
      F.bool('fpImb', 'Show imbalance', 1), F.num('imbR', 'Imbalance ratio', 3, 1.5, 10, .5), F.num('stackN', 'Stacked imbalance (rows)', 3, 2, 8, 1)]
  }},
  ae: {title: 'ABSORPTION / EXHAUSTION', tabs: {
    Detection: [
      F.sel('engine', 'Detection engine', ['Scored', 'Classic']),
      F.bool('aeAbs', 'Enable Absorption', 1), F.bool('aeExh', 'Enable Exhaustion', 1),
      F.num('minScore', 'Minimum Score', 70, 30, 100, 1), F.sel('sens', 'Sensitivity', ['Low', 'Medium', 'High'], 'Medium'),
      F.num('lookback', 'Baseline lookback (bars)', 100, 10, 500, 5), F.num('atrLen', 'ATR length (bars)', 14, 2, 100, 1),
      F.note('Scored: every candidate gets a 0-100 score from volume, delta, price progress and context. Classic: the original rule based detector.')],
    'Volume & Delta': [
      F.num('relVol', 'Relative Volume Filter (x)', 2, 1, 10, .5), F.num('minCell', 'Minimum Cell Volume (0 = Auto)', 0, 0, 1e9, 1),
      F.num('deltaStr', 'Delta Strength %', 70, 55, 95, 1), F.sel('deltaNorm', 'Delta Normalization', ['Share', 'Percentile'])],
    Progress: [
      F.num('maxProg', 'Max Price Progress % (0 = Auto)', 0, 0, 300, 10), F.sel('rangeNorm', 'Range Normalization', ['ATR (ticks)', 'Candle range']),
      F.num('follow', 'Follow-through bars', 3, 1, 20, 1), F.num('extLook', 'Extension lookback (bars)', 5, 1, 50, 1),
      F.num('minLevels', 'Minimum Levels', 1, 0, 6, 1), F.num('clusterLevels', 'Cluster Levels', 3, 1, 6, 1),
      F.num('persist', 'Minimum Persistence (updates)', 2, 0, 10, 1), F.num('minTrades', 'Minimum Trades per bar (0 = off)', 0, 0, 1e7, 1)],
    Context: [
      F.bool('ctxMP', 'Use Market Profile', 1), F.bool('ctxVP', 'Use Volume Profile', 1), F.bool('ctxVW', 'Use VWAP', 1),
      F.bool('ctxHM', 'Use Heatmap', 1), F.bool('ctxDOM', 'Use DOM', 1), F.num('ctxW', 'Context Weight %', 20, 0, 60, 5)],
    Confirmation: [
      F.sel('confMode', 'Confirmation Mode', ['Immediate', 'Follow-through', 'Retest']),
      F.num('retestWin', 'Retest window (bars)', 20, 1, 100, 1), F.num('retestTol', 'Retest tolerance (ticks)', 2, 0, 20, 1)],
    Display: [
      F.sel('aeMode', 'Mode', ['Marker', 'Badge']), F.bool('showScore', 'Show Score', 1),
      F.sel('labelStyle', 'Show Labels', ['Compact (SA 87)', 'Full name', 'None']), F.bool('showZones', 'Show Zones', 1),
      F.bool('showDev', 'Show developing (candidate) events', 1), F.bool('keepInv', 'Keep invalidated events visible', 1),
      F.bool('tipOn', 'Evidence tooltip on hover / tap', 1), F.bool('aeAlert', 'Alert (beep + status) on new live events', 0), F.num('hist', 'History (events)', 50, 5, 500, 5), F.num('aeOp', 'Opacity %', 80, 20, 100, 5),
      F.col('colBA', 'Buyer Absorption', '#20b98a'), F.col('colSA', 'Seller Absorption', '#ff9a3c'),
      F.col('colBE', 'Buyer Exhaustion', '#ffcc4d'), F.col('colSE', 'Seller Exhaustion', '#b794ff'), F.col('colAL', 'Labels & tooltip', '#f1f3f5')]
  }},
  bub: {title: 'ORDERFLOW BUBBLES', tabs: {
    Basics: [
      F.note('Executed trades grouped by time and price, sized by volume, coloured by the taker side. A bubble shows size traded aggressively, not who traded or why.'),
      F.sel('unit', 'Volume unit', ['Quote notional (USDT)', 'Coins (base)']),
      F.sel('thrMode', 'Show bubbles of at least', ['Adaptive (top % of recent)', 'Fixed value']),
      F.num('topPct', 'Top %', 1, .1, 20, .1), F.num('fixedVal', 'Fixed value', 0, 0, 1e9, 1000),
      F.bool('hlOn', 'Highlight at (x threshold)', 1), F.num('hlMult', 'Highlight multiple', 3, 1, 50, .5),
      F.sel('sizeBy', 'Size bubbles by', ['Total volume', 'Delta']), F.sel('colorBy', 'Colour by', ['Buy/sell balance', 'Dominant']),
      F.sel('shape', 'Shape', ['Solid', 'Pie']), F.sel('bLabels', 'Labels', ['Highlighted only', 'All labels', 'None'])],
    Advanced: [
      F.sel('timeWin', 'Time window', ['Auto by timeframe', 'Fixed 250ms', 'Fixed 1s', 'Fixed 5s', 'Fixed 30s']),
      F.sel('priceGroup', 'Price grouping', ['Auto (row size)', 'Ticks per band']), F.num('ticksBand', 'Ticks per band', 1, 1, 50, 1),
      F.sel('sizeCurve', 'Size curve', ['Area', 'Linear', 'Log']), F.num('largestAt', 'Largest at (x threshold)', 10, 2, 100, 1),
      F.num('minPx', 'Smallest bubble (px)', 4, 1, 20, 1), F.num('maxPx', 'Largest bubble (px)', 13, 6, 60, 1),
      F.num('bubOp', 'Opacity (%)', 60, 10, 100, 5), F.num('nonHlOp', 'Non-highlighted opacity (%)', 100, 10, 100, 5),
      F.sel('overlap', 'Overlapping bubbles', ['Hide covered bubbles', 'Show all']),
      F.sel('spacing', 'Screen spacing', ['Tight (3 px)', 'Normal (6 px)', 'Wide (10 px)'], 'Normal (6 px)'), F.bool('outline', 'Outline', 1)],
    Alerts: [
      F.bool('flash', 'Flash in the status strip', 0), F.bool('sound', 'Sound (needs one tap on the page first)', 0),
      F.note('Alerts only fire for new bubbles on the live candle, never from history.')],
    Colours: [
      F.col('colBuy', 'Aggressive buy', '#2dd4a0'), F.col('colSell', 'Aggressive sell', '#ff5c6c'), F.col('colBal', 'Balanced', '#94a3b8'),
      F.col('colRing', 'Highlight ring', '#f1f3f5'), F.col('colLbl', 'Labels', '#f1f3f5')]
  }},
  lim: {title: 'LIMIT ORDERS', tabs: {
    Basics: [
      F.note('Resting orders from the Binance Futures order book. Large orders are tracked as lines from the moment they appear until they are filled or pulled.'),
      F.sel('lmMode', 'Display', ['Lines + heatmap', 'Lines', 'Heatmap']),
      F.num('limK', 'Minimum size (x median level)', 12, 3, 100, 1), F.num('limMax', 'Max lines tracked', 5, 1, 12, 1),
      F.num('limAge', 'Show after (seconds)', 3, 0, 60, 1), F.bool('limHist', 'Show ended orders (filled / pulled)', 1),
      F.bool('limLbl', 'Show size labels', 1), F.num('limOp', 'Line opacity %', 85, 20, 100, 5)],
    Heatmap: [
      F.num('heatThr', 'Hide below (% of strongest)', 18, 0, 80, 1), F.num('heatGamma', 'Contrast (lower = brighter)', 0.7, 0.3, 1.5, .1), F.num('heatOp', 'Heatmap opacity %', 70, 10, 100, 5)],
    Colours: [F.col('colLB', 'Bid (buy) orders', '#2dd4a0'), F.col('colLA', 'Ask (sell) orders', '#ff7a59')]
  }}
};
const SET = {};
Object.values(SCH).forEach(s => Object.values(s.tabs).forEach(fs => fs.forEach(f => { if (f.k) SET[f.k] = f.d; })));
try { Object.assign(SET, JSON.parse(localStorage.smbs_set3 || '{}')); } catch(e){}
let setVer = 1;
function saveSet(){ try { localStorage.smbs_set3 = JSON.stringify(SET); } catch(e){} invalidate(); }
function invalidate(){ setVer++; evMemo.k = ''; hk = ''; dirty = true; }

function openDlg(id){
  const sc = SCH[id], tabs = Object.keys(sc.tabs), draft = Object.assign({}, SET); let cur = tabs[0];
  const el = $('dlg'); el.innerHTML = ''; el.classList.add('show');
  const box = document.createElement('div'); box.className = 'box';
  box.innerHTML = `<div class="hd"><b>${sc.title}</b><button class="x">&times;</button></div><div class="tabs"></div><div class="body"></div><div class="ft"><button class="df">Defaults</button><span></span><button class="cn">Cancel</button><button class="ok">OK</button></div>`;
  el.appendChild(box);
  const tabsEl = box.querySelector('.tabs'), body = box.querySelector('.body');
  const render = () => {
    tabsEl.innerHTML = ''; body.innerHTML = '';
    tabs.length > 1 && tabs.forEach(t => { const b = document.createElement('button'); b.textContent = t; if (t === cur) b.className = 'on'; b.onclick = () => { cur = t; render(); }; tabsEl.appendChild(b); });
    sc.tabs[cur].forEach(f => {
      if (f.t === 'i'){ const n = document.createElement('div'); n.className = 'note'; n.textContent = f.l; body.appendChild(n); return; }
      const row = document.createElement('div'); row.className = 'row';
      const lab = document.createElement('span'); lab.textContent = f.l; row.appendChild(lab);
      let inp;
      if (f.t === 'n'){ inp = document.createElement('input'); inp.type = 'number'; inp.min = f.mn; inp.max = f.mx; inp.step = f.st; inp.value = draft[f.k]; inp.onchange = () => { const v = +inp.value; draft[f.k] = isFinite(v) ? Math.min(f.mx, Math.max(f.mn, v)) : f.d; }; }
      else if (f.t === 'b'){ inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = !!draft[f.k]; inp.onchange = () => { draft[f.k] = inp.checked; }; }
      else if (f.t === 's'){ inp = document.createElement('select'); f.o.forEach(o => { const op = document.createElement('option'); op.textContent = o; inp.appendChild(op); }); inp.value = draft[f.k]; inp.onchange = () => { draft[f.k] = inp.value; }; }
      else { inp = document.createElement('input'); inp.type = 'color'; inp.value = draft[f.k]; inp.oninput = () => { draft[f.k] = inp.value; }; }
      row.appendChild(inp); body.appendChild(row);
    });
  };
  const close = () => { el.classList.remove('show'); el.innerHTML = ''; };
  box.querySelector('.x').onclick = close; box.querySelector('.cn').onclick = close;
  box.querySelector('.ok').onclick = () => { Object.assign(SET, draft); close(); $('ct').value = SET.chartType; saveSet(); };

    } else {
      const bw = Math.max(3, Math.min(10, sw * .14)), pad = 3, colW = (sw - 2 * pad - bw - 4) / 2, lx = x0 + pad, rx = x0 + sw - pad - colW, h = Math.max(1, rowH - .5);
      ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cxm, Y(c.h)); ctx.lineTo(cxm, Y(c.l)); ctx.stroke();
      ctx.fillRect(cxm - bw / 2, Math.min(Y(c.o), Y(c.c)), bw, Math.max(1, Math.abs(Y(c.o) - Y(c.c))));
      let mxc = 1e-9, mxd = 1e-9; a.rows.forEach(r => { mxc = Math.max(mxc, r[1], r[2]); mxd = Math.max(mxd, Math.abs(r[2] - r[1])); });
      const fo = SET.fpOp / 100, deltaMode = SET.cellMode === 'Delta';

        } else {
          ctx.fillStyle = poc ? '#000' : `rgba(239,83,80,${(.16 + .72 * Math.pow(sv / mxc, .75)) * fo})`; ctx.fillRect(lx, y, colW, h);
          ctx.fillStyle = poc ? '#000' : `rgba(38,166,154,${(.16 + .72 * Math.pow(bv / mxc, .75)) * fo})`; ctx.fillRect(rx, y, colW, h);

        if (SET.fpImb){

          if (a.ib.has(r)){ ctx.strokeStyle = DN; ctx.lineWidth = 1.4; ctx.strokeRect(lx + .5, y + .5, colW - 1, h - 1); }

            ctx.fillStyle = bv / mxc > .45 || poc ? '#fff' : '#c4c8d2'; ctx.fillText(tb, rx + colW / 2, y + h / 2 + fs * .35); ctx.textAlign = 'left';
          }
        }

        ctx.setLineDash([]);

      if (mode === 2 && SET.fpTot){
        const yb = Y(a.rows[0][0] * tk) + 11; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillStyle = DN; ctx.fillText(fmt(c.sell), lx + colW / 2, yb); ctx.fillStyle = UP; ctx.fillText(fmt(c.buy), rx + colW / 2, yb); ctx.textAlign = 'left';

      ctx.beginPath(); ctx.arc(cxm, y, rad, 0, 6.283); ctx.fillStyle = s.col + '44'; ctx.fill(); ctx.strokeStyle = s.col; ctx.lineWidth = s.heavy ? 2.2 : 1.5; ctx.stroke(); ctx.restore();

}

// absorption / exhaustion events from the scored engine
function drawEvents(V){
  if (SET.engine !== 'Scored') return;
  const evs = buildEvents(V.tk).filter(evShow).slice(-SET.hist), tA = V.tAt(-slot), tB = V.tAt(V.plotW + slot), used = {}, op = SET.aeOp / 100;
  evs.forEach(e => {
    if (e.t < tA - tf || e.t > tB) return; const c = candles.get(e.t); if (!c) return;
    const x = V.X(e.t) + slot / 2, key = e.t + e.side, u = used[key] || 0;
    const y = e.side === 'high' ? V.Y(c.h) - 10 - u : V.Y(c.l) + 10 + u + (V.fp2 && SET.fpTot ? 14 : 0);
    const col = SET[EVN[e.kind].c], inv = e.status === 'invalidated', cand = e.status === 'candidate';
    let txt = SET.labelStyle.startsWith('Compact') ? e.kind + (SET.showScore ? ' ' + e.score : '') : SET.labelStyle.startsWith('Full') ? EVN[e.kind].n + (SET.showScore ? ' ' + e.score : '') : '';
    ctx.globalAlpha = op * (inv ? .35 : cand ? .75 : 1);
    if (SET.aeMode === 'Marker'){
      ctx.beginPath(); ctx.arc(x, y, 5, 0, 6.283); ctx.fillStyle = rgba(col, .35); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1.8; if (cand) ctx.setLineDash([2, 2]); ctx.stroke(); ctx.setLineDash([]);

    } else {
      pill(x - 14, y - 6, txt || e.kind, col); used[key] = u + 16;

    ctx.globalAlpha = 1; V.hits.push({x, y, e});

}

// orderflow bubbles: neat clusters, only the biggest (adaptive top %), hidden when covered
function drawBubbles(V){
  const thr = bubThr(); if (!isFinite(thr) || thr <= 0) return;
  const tA = V.tAt(-30), tB = V.tAt(V.plotW + 30), list = [];
  for (let i = clusA.length - 1; i >= 0; i--){
    const c = clusA[i]; if (c.T0 < tA - 120000) break; if (c.T1 < tA || c.T0 > tB) continue;
    const v = bubVal(c); if (v < thr) continue;
    const p = c.pv / c.qq; if (p < V.lo || p > V.hi) continue;
    list.push({c, v, x: V.X((c.T0 + c.T1) / 2), y: V.Y(p)});
  }
  if (!list.length) return;
  list.sort((a, b) => b.v - a.v);
  const sp = SET.spacing.startsWith('Tight') ? 3 : SET.spacing.startsWith('Wide') ? 10 : 6, drawn = [], L = Math.max(2, SET.largestAt), rmin = SET.minPx, rmax = Math.max(SET.maxPx, rmin + 1);
  list.forEach(b => {
    const t = clp((b.v / thr - 1) / (L - 1));
    let r = SET.sizeCurve === 'Area' ? Math.sqrt(rmin * rmin + (rmax * rmax - rmin * rmin) * t) : SET.sizeCurve === 'Linear' ? rmin + (rmax - rmin) * t : rmin + (rmax - rmin) * clp(Math.log(1 + (b.v / thr - 1)) / Math.log(L));
    b.r = r;
    for (const d of drawn){ const dist = Math.hypot(d.x - b.x, d.y - b.y); if (dist < sp || (SET.overlap.startsWith('Hide') && dist < d.r)) return; }
    drawn.push(b);
    const c = b.c, q = SET.unit.startsWith('Quote'), buy = q ? c.buyN : c.buyQ, sell = q ? c.sellN : c.sellQ, tb = (buy + sell) ? (buy - sell) / (buy + sell) : 0;
    const hl = SET.hlOn && b.v >= SET.hlMult * thr;
    const fill = SET.colorBy.startsWith('Dominant') ? (tb >= 0 ? SET.colBuy : SET.colSell) : (tb >= 0 ? lerpHex(SET.colBal, SET.colBuy, tb) : lerpHex(SET.colBal, SET.colSell, -tb));
    ctx.globalAlpha = SET.bubOp / 100 * (SET.hlOn && !hl ? SET.nonHlOp / 100 : 1);
    if (SET.shape === 'Pie'){
      const sh = (buy + sell) ? buy / (buy + sell) : .5, a0 = -Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, r, a0, a0 + sh * 6.283); ctx.closePath(); ctx.fillStyle = SET.colBuy; ctx.fill();
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, r, a0 + sh * 6.283, a0 + 6.283); ctx.closePath(); ctx.fillStyle = SET.colSell; ctx.fill();
    } else { ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 6.283); ctx.fillStyle = fill; ctx.fill(); }
    if (SET.outline){ ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 6.283); ctx.strokeStyle = tb >= 0 ? 'rgba(150,255,215,.9)' : 'rgba(255,160,180,.9)'; ctx.lineWidth = 1.2; ctx.stroke(); }
    ctx.globalAlpha = 1;
    if (hl){ ctx.beginPath(); ctx.arc(b.x, b.y, r + 2, 0, 6.283); ctx.strokeStyle = SET.colRing; ctx.lineWidth = 1.4; ctx.stroke(); }
    if (SET.bLabels === 'All labels' || (SET.bLabels === 'Highlighted only' && hl)){
      if (r >= 6 || hl){ ctx.font = '10px sans-serif'; ctx.fillStyle = SET.colLbl; ctx.textAlign = 'left'; ctx.fillText(fmt(b.v), b.x + r + 4, b.y + 3); }
    }
  });
  V.bubN = drawn.length; V.bubT = list.length;
}

// limit orders: each large resting order is a line from the moment it appeared until it ended
function drawLimits(V){
  const now = Date.now(), op = SET.limOp / 100, list = [];
  if (SET.limHist) bigH.forEach(h => list.push(Object.assign({live: false}, h)));
  bigL.forEach(e => { if (now - e.since >= SET.limAge * 1000) list.push(Object.assign({live: true, until: now}, e)); });
  let mxN = 1; list.forEach(e => { mxN = Math.max(mxN, e.n); });
  list.forEach(e => {
    if (e.p < V.lo || e.p > V.hi) return;
    const x0 = Math.max(0, V.X(e.since)), x1 = e.live ? V.plotW : Math.min(V.plotW, V.X(e.until)); if (x1 < 0 || x0 > V.plotW || x1 <= x0) return;
    const y = V.Y(e.p), col = e.side === 'bid' ? SET.colLB : SET.colLA, w = 1 + 3 * Math.sqrt(e.n / mxN);
    ctx.globalAlpha = op * (e.live ? 1 : .45);
    ctx.fillStyle = rgba(col, .12); ctx.fillRect(x0, y - w, x1 - x0, w * 2);
    ctx.save(); if (e.live){ ctx.shadowColor = col; ctx.shadowBlur = 8; }
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.restore();
    ctx.globalAlpha = 1;
    if (!e.live){
      ctx.globalAlpha = op * .7; ctx.fillStyle = e.kind === 'FILLED' ? '#fff' : '#9aa3ad';
      ctx.beginPath(); if (e.kind === 'FILLED') ctx.arc(x1, y, 3, 0, 6.283); else { ctx.moveTo(x1 - 3, y - 3); ctx.lineTo(x1 + 3, y + 3); ctx.moveTo(x1 + 3, y - 3); ctx.lineTo(x1 - 3, y + 3); ctx.strokeStyle = '#9aa3ad'; ctx.lineWidth = 1.4; ctx.stroke(); }
      if (e.kind === 'FILLED') ctx.fill(); ctx.globalAlpha = 1;
    }
    if (SET.limLbl && (e.live || V.X(e.until) - x0 > 40)){
      const sec = Math.floor(((e.live ? now : e.until) - e.since) / 1000), age = sec < 90 ? sec + 's' : Math.floor(sec / 60) + 'm';
      pill(e.live ? V.plotW - 4 : Math.min(V.plotW - 4, x1 - 4), y - 15, fmt(e.n) + (e.live ? '  ' + age : ' ' + e.kind.toLowerCase()), col, true);
    }
  });
}

function drawDrawings(V){
  const items = drw.concat(pend ? [{type: 'dot', t: pend.t, p: pend.p}] : []);
  items.forEach(d => {

function drawRight(V, nodes){
  const {Y, tk, rowH, lo, hi, plotW, plotH, bkx, vpx, dpx, axx, AXW, BKW, VPW, DPW, prof} = V;
  if (BKW && synced){
    const bk = new Map();
    for (const side of [ob.b, ob.a]) for (const [p, q] of side){ if (p < lo || p > hi) continue; const r = Math.floor(p / tk + 1e-9); bk.set(r, (bk.get(r) || 0) + q); }
    let bm = 0; bk.forEach(v => { if (v > bm) bm = v; });
    ctx.fillStyle = 'rgba(255,255,255,.02)'; ctx.fillRect(bkx, 0, BKW - 2, plotH);
    if (bm > 0){
      bk.forEach((q, r) => { const v = q / bm; ctx.fillStyle = HS[Math.round(Math.pow(v, .7) * 63)]; ctx.fillRect(bkx + 2, Y((r + 1) * tk), Math.max(1, v * (BKW - 8)), Math.max(1, rowH - 1)); });

    }

    }

    ctx.font = 'bold 9px sans-serif'; ctx.fillStyle = MUT; ctx.textAlign = 'left'; ctx.fillText('\u0394 PROFILE', dpx + 3, 10); ctx.fillStyle = sd >= 0 ? UP : DN; ctx.fillText('\u03A3 ' + sgn(sd), dpx + 3, 21);

// bottom: Delta and Volume per candle (from Binance taker-buy volume, so every timeframe is complete)

function drawTimeAxis(V){
  const y0 = V.plotH + 34; ctx.fillStyle = BGC; ctx.fillRect(0, y0, V.plotW + V.BKW + V.VPW + V.DPW, 18);
  ctx.strokeStyle = '#2a2e39'; ctx.beginPath(); ctx.moveTo(0, y0 + .5); ctx.lineTo(V.axx, y0 + .5); ctx.stroke();
  ctx.font = '11px sans-serif'; ctx.fillStyle = MUT; ctx.textAlign = 'center';
  const tt = timeTicks(V);
  tt.out.forEach(t => { const x = V.X(t) + slot / 2; if (x > 18 && x < V.plotW - 18) ctx.fillText(tlabel(t, tt.st), x, y0 + 13); });
  ctx.textAlign = 'left';
}
function drawCross(V){
  if (mx == null || my == null || mx < 0 || mx > V.plotW || my < 0 || my > V.plotH) return;
  ctx.strokeStyle = 'rgba(120,123,134,.9)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(mx, 0); ctx.lineTo(mx, V.plotH + 34); ctx.moveTo(0, my); ctx.lineTo(V.plotW, my); ctx.stroke(); ctx.setLineDash([]);
  const p = V.lo + (V.plotH - my) / V.plotH * (V.hi - V.lo), dec = decFor((V.pt || {st: 1}).st);
  ctx.fillStyle = '#363a45'; ctx.fillRect(V.axx + 1, my - 9, V.AXW - 1, 18); ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.fillText(pf(p, dec), V.axx + 5, my + 4);
  const t = Math.floor(V.tAt(mx) / tf) * tf, lab = new Date(t).toLocaleString('en-GB', {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
  const w = ctx.measureText(lab).width + 14, x = Math.max(w / 2, Math.min(V.plotW - w / 2, mx));
  ctx.fillStyle = '#363a45'; ctx.fillRect(x - w / 2, V.plotH + 34, w, 18); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(lab, x, V.plotH + 47); ctx.textAlign = 'left';
  if (SET.tipOn && !tipE){ let best = null, bd = 16; V.hits.forEach(h => { const d = Math.hypot(h.x - mx, h.y - my); if (d < bd){ bd = d; best = h.e; } }); if (best) drawTip(V, best); }
  else if (tipE) drawTip(V, tipE);
}
function drawTip(V, e){
  const c = candles.get(e.t); if (!c) return;
  const ev = e.ev, L = [EVN[e.kind].n + '  \u00B7  score ' + e.score, 'Status: ' + e.status];
  if (e.kind === 'BA' || e.kind === 'SA'){ L.push('Cluster volume x' + ev.vRatio.toFixed(1) + ' of an average row'); L.push('Aggressor share ' + (ev.share * 100).toFixed(0) + '%'); L.push('Price held ' + (ev.held * 100).toFixed(0) + '%  \u00B7  progress ' + ev.prog.toFixed(2) + 'x'); }
  else { L.push('Thin tail ' + ev.tail.toFixed(2) + 'x avg row'); L.push('Volume fade ' + (ev.fade * 100).toFixed(0) + '%'); L.push('Extension ' + ev.ext.toFixed(2) + 'x  \u00B7  rejection ' + (ev.held * 100).toFixed(0) + '%'); }
  L.push('Context ' + (ev.ctx * 100).toFixed(0) + '%  \u00B7  rel. volume x' + ev.relV.toFixed(2));
  ctx.font = '11px sans-serif'; const w = Math.max(...L.map(s => ctx.measureText(s).width)) + 16, h = L.length * 15 + 8;
  let x = Math.min(V.plotW - w - 4, Math.max(4, (V.X(e.t) + slot / 2) + 14)), y = Math.max(4, Math.min(V.plotH - h - 4, (e.side === 'high' ? V.Y(c.h) + 20 : V.Y(c.l) - h - 20)));
  ctx.fillStyle = 'rgba(15,18,24,.96)'; rr(x, y, w, h, 6); ctx.fill(); ctx.strokeStyle = SET[EVN[e.kind].c]; ctx.lineWidth = 1; ctx.stroke();
  L.forEach((s, i) => { ctx.fillStyle = i === 0 ? SET[EVN[e.kind].c] : SET.colAL; ctx.font = (i === 0 ? 'bold ' : '') + '11px sans-serif'; ctx.fillText(s, x + 8, y + 18 + i * 15); });
}
function drawLegend(V, legend){
  const c = V.hov || candles.get(V.ks[V.ks.length - 1]); if (!c) return;
  const col = c.c >= c.o ? UP : DN, d = c.buy - c.sell, chg = c.c - c.o, pc = c.o ? chg / c.o * 100 : 0;
  const MONO = 'ui-monospace, Menlo, Consolas, monospace', WT = '#cfd6df';
  let y = 16, x = 10;
  const seg = (t, cl, f) => { ctx.font = f || ('12px ' + MONO); ctx.fillStyle = cl; ctx.textAlign = 'left'; ctx.fillText(t, x, y); x += ctx.measureText(t).width + 8; };
  const nl = () => { y += 16; x = 10; };
  seg('\u25C6 ' + S + ' \u00B7 ' + tfName() + ' \u00B7 BINANCE', '#e6e9ef', 'bold 12px ' + MONO);
  seg('O', MUT); seg(pf(c.o), col); seg('H', MUT); seg(pf(c.h), col); seg('L', MUT); seg(pf(c.l), col); seg('C', MUT); seg(pf(c.c), col);
  seg((chg >= 0 ? '+' : '') + pf(chg) + ' (' + (pc >= 0 ? '+' : '') + pc.toFixed(2) + '%)', col);
  nl(); seg('| Volume', MUT); seg('T ' + fmt(c.buy + c.sell), '#e6e9ef'); seg('B ' + fmt(c.buy), UP); seg('S ' + fmt(c.sell), DN); seg('D ' + sgn(d), d >= 0 ? UP : DN);
  if (fl('lg')){
    legend.forEach(l => { nl(); seg(l.t, l.c === MUT ? MUT : WT); });
    if (fl('vp')){ nl(); seg('Volume Profile', WT); }
    if (fl('lo') && SET.lmMode !== 'Lines'){ nl(); seg('DOM Heatmap', heat.length ? WT : MUT); }
    if (fl('bb')){
      const th = bubThr(), q = SET.unit.startsWith('Quote');
      nl(); seg('Clusters ' + Math.round(bubWin() / 1000) + ' s \u00D7 ' + (SET.priceGroup.startsWith('Auto') ? '1 row' : SET.ticksBand + ' ticks') + ' \u00B7 ' + (SET.thrMode.startsWith('Adapt') ? 'Adaptive top ' + SET.topPct + ' %' : 'Fixed') + ' \u00B7 live \u2265 ' + (isFinite(th) ? fmt(th) + (q ? ' USDT' : '') : 'collecting') + (V.bubT ? ' \u00B7 ' + V.bubN + '/' + V.bubT + ' drawn (covered ones hidden)' : ''), MUT, '11px ' + MONO);
    }
    if (fl('sg')){
      const evs = SET.engine === 'Scored' ? buildEvents(V.tk).filter(evShow) : [], e = evs[evs.length - 1];
      nl(); seg('Absorption / Exhaustion', WT); if (e) seg(e.kind + ' ' + e.score, SET[EVN[e.kind].c]);
    }
    { let st = null; for (let i = V.ks.length - 1; i >= 0 && i > V.ks.length - 40 && !st; i--){ const k = candles.get(V.ks[i]); if (!k.fp) continue; const a = ana(k, V.tk); if (a.stk.length) st = a.stk[a.stk.length - 1]; }
      nl(); seg('Imbalance', WT); if (st) seg((st.side === 'buy' ? 'SBI ' : 'SSI ') + (st.r1 - st.r0 + 1) + 'L', st.side === 'buy' ? UP : DN); }
    if (fl('dp') && V.prof){
      const p = V.prof; let bi = 0; for (let i = 1; i < p.len; i++) if (Math.abs(p.ask[i] - p.bid[i]) > Math.abs(p.ask[bi] - p.bid[bi])) bi = i;
      const dd = p.ask[bi] - p.bid[bi]; nl(); seg('Delta Profile', WT); seg('DPOC ' + pf((p.rmin + bi) * V.tk + V.tk / 2) + ' \u00B7 ' + sgn(dd), dd >= 0 ? UP : DN);
    }
    if (fl('zn')){ nl(); seg('Footprint zones: ' + (V.zoneN || 0), MUT, '11px ' + MONO); }
  }
  nl();
  if (fl('fp') && !c.fp) seg(c.k ? (c.fail ? 'Footprint unavailable for this candle (too many trades to load)' : slot >= 26 && tf >= 6e4 && tf <= 18e5 ? 'Footprint loading for this candle ...' : 'Zoom in (5m or lower) to load the footprint for this candle') : 'Partial candle (page opened mid-candle)', MUT, '11px ' + MONO);
  else if (V.hov && c.fp && my != null && my >= 0 && my <= V.plotH){
    const a = ana(c, V.tk), r = Math.floor((V.lo + (V.plotH - my) / V.plotH * (V.hi - V.lo)) / V.tk + 1e-9), row = a.rows.find(z => z[0] === r);
    if (row) seg('Row ' + pf(r * V.tk) + '   Vol ' + fmt(row[1] + row[2]) + '   \u0394 ' + sgn(row[2] - row[1]) + '   Buy ' + fmt(row[2]) + '   Sell ' + fmt(row[1]), '#ffc107', '11px ' + MONO);
  }
  if (lazyLeft && fl('fp')){ nl(); seg('Loading footprint history: ' + lazyLeft + ' candle(s) left', MUT, '11px ' + MONO); }
}

// ===================== INTERACTION (touch first, mouse and keyboard also work) =====================
const P = new Map(); let g = null;
function setTool(t){ tool = t; pend = null; ['x', 'h', 't'].forEach(k => $('t_' + k).classList.toggle('on', k === t)); dirty = true; }
$('t_x').onclick = () => setTool('x'); $('t_h').onclick = () => setTool('h'); $('t_t').onclick = () => setTool('t');
$('t_c').onclick = () => { drw = []; pend = null; saveDr(); setTool('x'); };
function saveDr(){ try { localStorage['smbs_dr_' + S] = JSON.stringify(drw); } catch(e){} }
function closeMenus(){ $('mi').classList.remove('show'); $('ms').classList.remove('show'); }
$('bi').onclick = () => { $('mi').classList.toggle('show'); $('ms').classList.remove('show'); };
$('bs').onclick = () => { $('ms').classList.toggle('show'); $('mi').classList.remove('show'); };
$('cg').onclick = () => { closeMenus(); openDlg('cnd'); };
document.querySelectorAll('.gr').forEach(b => b.onclick = () => { closeMenus(); openDlg(b.dataset.d); });
$('ct').onchange = () => { SET.chartType = $('ct').value; saveSet(); };
document.querySelectorAll('.menu input,.menu select').forEach(el => el.addEventListener('change', () => { dirty = true; hk = ''; }));
['xbn', 'xby', 'xok', 'xhl'].forEach(id => $(id).addEventListener('change', () => connect()));
$('pd').onchange = () => { $('pad').classList.toggle('show', $('pd').checked); try { localStorage.smbs_pad = $('pd').checked ? 1 : 0; } catch(e){} };
$('rv').onclick = () => { off = 0; vz = 1; auto = true; slot = W < 640 ? 56 : 64; dirty = true; };
$('ra').onclick = () => { try { localStorage.smbs_rec = $('rec').value; } catch(e){} connect(); closeMenus(); };
$('sym').addEventListener('keydown', e => { if (e.key === 'Enter'){ try { localStorage.smbs_sym = $('sym').value; } catch(e2){} connect(); $('sym').blur(); } });
const tfsEl = $('tfs');
TFS.forEach(([n, ms]) => { const b = document.createElement('button'); b.className = 'tfb'; b.textContent = n; b.dataset.ms = ms; b.onclick = () => { tf = ms; try { localStorage.smbs_tf = ms; } catch(e){} markTf(); connect(); }; tfsEl.appendChild(b); });
function markTf(){ tfsEl.querySelectorAll('.tfb').forEach(b => b.classList.toggle('on', +b.dataset.ms === tf)); }

// on-screen controls: arrows, zoom, reset, jump to latest (hold to repeat)
function nav(k){
  if (!G) return;
  if (k === 'L') off = clampOff(off + 4); else if (k === 'R') off = clampOff(off - 4);
  else if (k === 'U' || k === 'D'){ goManual(); const sh = (pHi - pLo) * .12 * (k === 'U' ? 1 : -1); pLo += sh; pHi += sh; }
  else if (k === 'ZI') setSlot(slot * 1.15, G.plotW * .7); else if (k === 'ZO') setSlot(slot / 1.15, G.plotW * .7);
  else if (k === 'RS'){ off = 0; vz = 1; auto = true; slot = W < 640 ? 56 : 64; } else if (k === 'NOW') off = 0;
  dirty = true;
}
let padT = null;
document.querySelectorAll('#pad button').forEach(b => {
  const stop = () => { clearInterval(padT); padT = null; };
  b.addEventListener('pointerdown', e => { e.preventDefault(); nav(b.dataset.n); if (!['RS', 'NOW'].includes(b.dataset.n)){ stop(); padT = setInterval(() => nav(b.dataset.n), 90); } });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
});
addEventListener('keydown', e => {
  if (e.target && /INPUT|SELECT/.test(e.target.tagName)) return;
  const m = {ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', '+': 'ZI', '=': 'ZI', '-': 'ZO', Home: 'RS', End: 'NOW'}[e.key]; if (m){ e.preventDefault(); nav(m); }
});

const priceAt = y => G.lo + (G.plotH - y) / G.plotH * (G.hi - G.lo);
function tap(x, y){
  if (!G) return;
  if (x > G.axx){
    if (y > G.plotH - 26 && y < G.plotH){ auto = true; vz = 1; dirty = true; return; }
    const n = Date.now(); if (n - lastAx < 350){ auto = true; vz = 1; dirty = true; } lastAx = n; return;
  }
  if (x > G.plotW || y > G.plotH) return;
  if (tool === 'h'){ drw.push({type: 'h', p: priceAt(y)}); saveDr(); setTool('x'); }
  else if (tool === 't'){
    const pt = {t: Math.floor(G.tAt(x) / tf) * tf, p: priceAt(y)};
    if (!pend) pend = pt; else { drw.push({type: 't', t1: pend.t, p1: pend.p, t2: pt.t, p2: pt.p}); saveDr(); setTool('x'); }
  } else {
    mx = x; my = y; tipE = null;
    if (SET.tipOn && G.hits){ let best = null, bd = 18; G.hits.forEach(h => { const d = Math.hypot(h.x - x, h.y - y); if (d < bd){ bd = d; best = h.e; } }); tipE = best; }
  }
  dirty = true;
}
function relXY(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch(x){}
  closeMenus();
  const [x, y] = relXY(e); P.set(e.pointerId, {x, y});
  if (P.size === 1) g = {mode: G && x > G.axx ? 'vz' : 'pan', x0: x, y0: y, off0: off, vz0: vz, lo0: G ? G.lo : 0, hi0: G ? G.hi : 1, t0: Date.now(), moved: false};
  else if (P.size === 2){
    const [a, b] = [...P.values()];
    g = {mode: 'pinch', d0: Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)), slot0: slot, cx: (a.x + b.x) / 2, moved: true};
  }
});
cv.addEventListener('pointermove', e => {
  const [x, y] = relXY(e);
  if (!P.has(e.pointerId)){ if (e.pointerType === 'mouse'){ mx = x; my = y; dirty = true; } return; }
  const pp = P.get(e.pointerId); pp.x = x; pp.y = y;
  if (!g || !G) return;
  if (g.mode === 'pinch'){
    if (P.size >= 2){ const [a, b] = [...P.values()]; setSlot(g.slot0 * Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)) / g.d0, g.cx); }
    return;
  }
  const dx = x - g.x0, dy = y - g.y0;
  if (!g.moved && Math.hypot(dx, dy) > 6) g.moved = true;
  if (!g.moved) return;
  if (g.mode === 'vz'){
    auto = false;
    const mid = (g.lo0 + g.hi0) / 2, half = (g.hi0 - g.lo0) / 2 * Math.exp(dy / 200);
    pLo = mid - half; pHi = mid + half;
  } else {
    off = clampOff(g.off0 + dx / slot);
    if (!auto || Math.abs(dy) > 12){
      if (auto){ auto = false; }
      const sh = dy / G.plotH * (g.hi0 - g.lo0);
      pLo = g.lo0 + sh; pHi = g.hi0 + sh;
    }
  }
  if (e.pointerType === 'mouse'){ mx = x; my = y; }
  dirty = true;
});
function endPtr(e, cancel){
  if (!P.has(e.pointerId)) return;
  P.delete(e.pointerId);
  if (P.size === 0){
    if (g && !cancel && !g.moved && g.mode !== 'pinch' && Date.now() - g.t0 < 500){ const [x, y] = relXY(e); tap(x, y); }
    g = null;
  } else if (g && g.mode === 'pinch') g = null;
}
cv.addEventListener('pointerup', e => endPtr(e, false));
cv.addEventListener('pointercancel', e => endPtr(e, true));
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !P.size){ mx = my = null; dirty = true; } });
cv.addEventListener('wheel', e => {
  e.preventDefault(); if (!G) return;
  const [x] = relXY(e);
  if (x > G.axx){ goManual(); const f = Math.exp(e.deltaY / 500), mid = (pLo + pHi) / 2, half = (pHi - pLo) / 2 * f; pLo = mid - half; pHi = mid + half; }
  else if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) off = clampOff(off - (e.deltaX || e.deltaY) / slot);
  else setSlot(slot * (e.deltaY < 0 ? 1.1 : 1 / 1.1), x);
  dirty = true;
}, {passive: false});

// ===================== START =====================
function frame(){
  if (dirty){
    try { draw(); }
    catch(err){ dirty = false; console.error(err); $('st').textContent = 'Draw error: ' + err.message; cv.width = W * dpr; }   // resetting the canvas clears any stuck clip/state
  }
  requestAnimationFrame(frame);
}
setInterval(() => { if (!document.hidden){ dirty = true; renderTape(); } }, 250);   // live trades, countdown
setInterval(refreshRecent, 60000);
setInterval(lazyStep, 1500);
try {
  if (localStorage.smbs_sym) $('sym').value = localStorage.smbs_sym;
  const t = +localStorage.smbs_tf; if (TFS.some(x => x[1] === t)) tf = t;
  if (localStorage.smbs_rec) $('rec').value = localStorage.smbs_rec;
  if (localStorage.smbs_pad === '1'){ $('pd').checked = true; $('pad').classList.add('show'); }
} catch(e){}
if (!['Candles', 'Hollow candles', 'Bars', 'Heikin Ashi', 'Line', 'Area'].includes(SET.chartType)) SET.chartType = 'Candles';
$('ct').value = SET.chartType;
markTf();
connect();
requestAnimationFrame(frame);
</script>
